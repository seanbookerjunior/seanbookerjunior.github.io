<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />

  <title>ELVYN</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />

    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
    rel="stylesheet"

  <link rel="icon" type="image/png" href="images/Elvyn new logo.PNG" />

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: #050509;
      font-family: 'Inter', sans-serif;
      color: #f9fafb;
    }

    .card {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 1.5rem;
      padding: 2.75rem 2.25rem;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
    }

    .card-logo {
      width: 72px;
      height: 72px;
      border-radius: 999px;
      object-fit: cover;
      border: 1px solid rgba(148, 163, 184, 0.5);
      margin-bottom: 1rem;
    }

    .card-name {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: #f9fafb;
      margin: 0 0 1.75rem;
    }

    .card-socials {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.75rem;
    }

    .card-social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: rgba(15, 23, 42, 0.6);
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .card-social-btn img {
      width: 18px;
      height: 18px;
      filter: invert(100%);
      opacity: 0.85;
    }

    .card-social-btn:hover {
      border-color: rgba(148, 163, 184, 0.5);
      background: rgba(15, 23, 42, 0.9);
    }

    .card-links {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .card-link {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #f9fafb;
      border: 1px solid rgba(186, 230, 253, 0.3);
      border-radius: 999px;
      padding: 0.8rem 1.4rem;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      box-shadow: 0 14px 45px rgba(2, 132, 199, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .card-link:hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 55px rgba(2, 132, 199, 0.45);
    }

    .card-link.secondary {
      background: transparent;
      border: 1px solid rgba(148, 163, 184, 0.35);
      box-shadow: none;
    }

    .card-link.secondary:hover {
      border-color: rgba(148, 163, 184, 0.6);
      box-shadow: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <img src="images/Elvyn new logo.PNG" alt="ELVYN" class="card-logo" />
    <p class="card-name">ELVYN</p>

    <div class="card-socials">
      <a href="https://www.instagram.com/seanwavy/" target="_blank" class="card-social-btn" aria-label="Instagram">
        <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/instagram.svg" alt="Instagram" />
      </a>
      <a href="https://x.com/prodseanwavy" target="_blank" class="card-social-btn" aria-label="X">
        <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/x.svg" alt="X" />
      </a>
      <a href="https://discord.gg/WXKfqwEwj6" target="_blank" class="card-social-btn" aria-label="Discord">
        <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/discord.svg" alt="Discord" />
      </a>
      <a href="https://www.youtube.com/@seanwavy" target="_blank" class="card-social-btn" aria-label="YouTube">
        <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/youtube.svg" alt="YouTube" />
      </a>
      <a href="https://open.spotify.com/show/2Z0usXtLWuz2JlIuV7R21L?si=9434293a9410491d&nd=1&dlsi=803d7315c3d44971" target="_blank" class="card-social-btn" aria-label="Spotify">
        <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/spotify.svg" alt="Spotify" />
      </a>
    </div>

    <div class="card-links">
      <a href="https://whop.com/backwardshatguy/30-minute-coaching-call-51/" target="_blank" class="card-link">Book a 1:1 Call</a>
      <a href="https://whop.com/checkout/plan_J4ICEsCmofece" target="_blank" class="card-link secondary">Get the E-Book</a>
    </div>
  </div>

</body>
</html>
